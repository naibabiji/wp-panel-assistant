accessibility:
  animations: true
appearance:
  dock: off
  dockScreen: current
  dockFill: 0.5
  dockSpace: 1
  dockHideOnBlur: false
  dockAlwaysOnTop: true
  flexTabs: false
  tabsLocation: top
  tabsInFullscreen: false
  cycleTabs: true
  theme: Follow the color scheme
  frame: thin
  css: '/* * { color: blue !important; } */'
  opacity: 1.0
  vibrancy: false
  vibrancyType: 'blur'
  lastTabClosesWindow: false
  spaciness: 1
  colorSchemeMode: 'auto' # WPPA: follow system theme
terminal:
  showBuiltinProfiles: true
  showRecentProfiles: 3
  paneResizeStep: 0.1
  focusFollowsMouse: false
  identification: null
hotkeys:
  profile:
    __nonStructural: true
  profile-selectors:
    __nonStructural: true
  group-selectors:
    __nonStructural: true
profiles: []
groups: []
profileDefaults:
  __nonStructural: true
  ssh:
    disableDynamicTitle: true
recoverTabs: false # WPPA: tab recovery stored SSH passwords and terminal output in plain text
enableAnalytics: false # WPPA: analytics removed (ADR-0005)
enableWelcomeTab: false # WPPA: WP Panel Assistant home page replaces the welcome tab
electronFlags: []
enableAutomaticUpdates: false # WPPA: upstream auto-update removed (ADR-0005)
hideTray: false
version: 1
vault: null
encrypted: false
enableExperimentalFeatures: false
pluginBlacklist: []
commandBlacklist: []
providerBlacklist: []
profileBlacklist: []
hacks:
  disableGPU: false
  disableVibrancyWhileDragging: false
  enableFluentBackground: false
  globalHotkey: null
language: null
defaultQuickConnectProvider: "ssh"
showProfileTree: false
